# Builds and tests Banyan with xcodebuild.
# This is an XcodeGen + xcodebuild iOS app (SwiftUI/SwiftData), not a SwiftPM
# package, so `swift build` / `swift test` do not apply. The .xcodeproj is
# generated from project.yml and gitignored, so CI regenerates it first.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Create placeholder Supabase config
      # Supabase.plist is gitignored (see SupabaseConfig.swift), so it's absent on
      # CI. The test bundle is hosted in the app, so launching the test host runs
      # BanyanApp.init → SupabaseConfig.url, which fatalErrors without it and
      # crashes the host before any test runs. The anon key is public-by-design and
      # the tests never touch the network (all mocked), so placeholder values that
      # satisfy SupabaseConfig's guards (valid URL, non-empty non-sentinel key) are
      # all CI needs. Must exist before `xcodegen generate` so it's bundled.
      run: |
        cat > Banyan/Supabase.plist <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>SupabaseURL</key>
          <string>https://placeholder.supabase.co</string>
          <key>SupabaseAnonKey</key>
          <string>ci-placeholder-anon-key</string>
        </dict>
        </plist>
        EOF

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Build and test
      run: |
        # Pick any available iPhone simulator on the runner — the hardware/OS
        # differs from the local iPhone 17, so don't hardcode a device name.
        UDID=$(xcrun simctl list --json devices available \
          | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
        if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
          echo "No iPhone simulator available on the runner" >&2
          exit 1
        fi
        echo "Testing on simulator $UDID"
        xcodebuild test \
          -scheme Banyan \
          -sdk iphonesimulator \
          -destination "id=$UDID" \
          CODE_SIGNING_ALLOWED=NO

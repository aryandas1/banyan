name: Banyan

options:
  bundleIdPrefix: com.aryandas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Banyan:
    type: application
    platform: iOS
    sources:
      - path: Banyan
    dependencies:
      - package: Supabase
        product: Supabase
    # CFBundleURLTypes can't be expressed as a scalar INFOPLIST_KEY_*, so the plist
    # is written explicitly by XcodeGen (GENERATE_INFOPLIST_FILE: NO). The scene
    # manifest / launch screen / orientations that were previously synthesised from
    # INFOPLIST_KEY_*_Generation are migrated into `properties` here verbatim.
    info:
      path: Banyan/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.aryandas.Banyan.invite
            CFBundleURLSchemes:
              - banyan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aryandas.Banyan
        PRODUCT_NAME: Banyan
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - BanyanTests
      gatherCoverageData: true

  BanyanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BanyanTests
    dependencies:
      - target: Banyan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aryandas.BanyanTests
        GENERATE_INFOPLIST_FILE: YES
